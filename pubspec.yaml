name: sehat_satli
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 4.2.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  cached_network_image_platform_interface: 4.1.1
  cached_network_image_web: 1.3.1
  cloud_firestore: 5.6.9
  cloud_firestore_platform_interface: 6.6.9
  cloud_firestore_web: 4.4.9
  collection: 1.19.1
  connectivity_plus: 6.1.4
  crypto: ^3.0.3
  firebase_core: 3.14.0
  firebase_core_platform_interface: 5.4.0
  firebase_core_web: 2.23.0
  firebase_performance: 0.10.1+7
  firebase_performance_platform_interface: 0.1.5+7
  firebase_performance_web: 0.1.7+13
  flutter_animate: 4.5.0
  flutter_cache_manager: 3.4.1
  flutter_image_compress: 2.3.0
  flutter_plugin_android_lifecycle: 2.0.28
  flutter_secure_storage: 9.2.4
  flutter_spinkit: 5.2.0
  flutter_svg: 2.1.0
  from_css_color: 2.0.0
  geolocator: 13.0.2
  go_router: 12.1.3
  google_fonts: 6.3.3
  http: 1.4.0
  image_picker: 1.1.2
  intl: 0.20.2
  json_path: 0.7.2
  page_transition: 2.2.2
  path_provider: 2.1.4
  path_provider_android: 2.2.10
  path_provider_foundation: 2.4.0
  path_provider_linux: 2.2.1
  path_provider_platform_interface: 2.1.2
  path_provider_windows: 2.3.0
  percent_indicator: 4.2.2
  plugin_platform_interface: 2.1.8
  provider: 6.1.5
  shared_preferences: 2.5.3
  shared_preferences_android: 2.4.10
  shared_preferences_foundation: 2.5.4
  shared_preferences_linux: 2.4.1
  shared_preferences_platform_interface: 2.4.1
  shared_preferences_web: 2.4.3
  shared_preferences_windows: 2.4.1
  sqflite: 2.3.3+1
  sqflite_common: 2.5.4+3
  stream_transform: 2.1.0
  timeago: 3.7.1
  uuid: 4.6.0
  url_launcher: 6.3.1
  url_launcher_android: 6.3.16
  url_launcher_ios: 6.3.3
  url_launcher_linux: 3.2.1
  url_launcher_macos: 3.2.2
  url_launcher_platform_interface: 2.3.2
  url_launcher_web: 2.4.1
  url_launcher_windows: 3.1.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0
  lucide_icons_flutter: ^3.1.15

dependency_overrides:
  http: 1.4.0
  # sqflite_common_ffi 2.3.5 (dev-only, test infra for the offline-sync
  # suite) allows sqlite3 up to <4.0.0 but actually only works against the
  # pre-3.x API shape (`package:sqlite3/open.dart`, removed in 3.x) — pin to
  # the last 2.x line so `flutter pub get` doesn't pick an incompatible 3.x.
  sqlite3: ^2.4.6

dev_dependencies:
  flutter_lints: 4.0.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  # FFI sqflite backend for `flutter test` (no platform channels available
  # there) — lets the offline-sync test suite exercise the real SQLite
  # schema/queries instead of mocking the database away.
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/branding/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

    - assets/sqlite_db_files/


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# Launcher icon — SehatSatli globe mark on white (variant A: Play/App Store safe, high contrast).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/branding/icon-mark.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/branding/icon-mark.png"
  web:
    generate: true
    image_path: "assets/images/branding/icon-mark.png"
    background_color: "#FFFFFF"
    theme_color: "#17B273"

# Native splash screen — logo mark on brand background, shown before Flutter engine boots.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/branding/icon-mark.png"
  color_dark: "#17B273"
  image_dark: "assets/images/branding/icon-mark-white.png"
  android_12:
    image: "assets/images/branding/icon-mark.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/images/branding/icon-mark-white.png"
    icon_background_color_dark: "#17B273"
  web: true

